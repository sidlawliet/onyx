[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "investops-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api.app*"]
